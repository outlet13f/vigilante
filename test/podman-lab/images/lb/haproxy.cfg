global
    stats socket /run/haproxy/admin.sock mode 660 group haproxy level admin
    stats socket ipv4@0.0.0.0:9999 level admin

defaults
    mode http
    timeout connect 2s
    timeout client 30s
    timeout server 30s

frontend fe
    bind :8081
    default_backend app_backend

backend app_backend
    server app1 10.89.50.11:18080 check inter 1s
    server app2 10.89.50.12:18080 check inter 1s
