name: static-web
version: 1
description: 정적 웹·프록시 계층(Nginx 등). HTTP 헬스, 액세스 로그 5xx 비율, 지연
params:
  - {name: health_url, required: true, description: "헬스체크 URL (예: http://{{.Address}}/healthz)"}
  - {name: access_log, required: true, description: 액세스 로그 경로}
  - {name: access_log_format, default: combined, description: "combined | json"}
  - {name: error_rate_pct, default: 1, description: 롤백할 5xx 비율(%)}
  - {name: health_failures, default: 3, description: 롤백할 헬스체크 연속 실패 횟수}
  - {name: window, default: 30s, description: 5xx 비율 판정 구간}
  - {name: latency_window, default: 1m, description: p99 지연 판정 구간}
  - {name: p99_increase_pct, default: 200, description: 배포 전 대비 p99 증가율(%)}
  - {name: p99_min_ms, default: 100, description: p99 절대 하한(ms)}
---
probes:
  - id: health
    type: http
    interval: 2s
    timeout: 1s
    http: {url: "[[ .health_url ]]"}
  - id: access
    type: access_log
    access_log: {path: "[[ .access_log ]]", format: "[[ .access_log_format ]]"}
rules:
  - name: errors
    when:
      any:
        - {metric: access.count_5xx, ratio_of: access.requests, window: [[ .window ]], op: ">", value: [[ .error_rate_pct ]], for: 2}
        - {metric: health.consecutive_failures, op: ">=", value: [[ .health_failures ]]}
  - name: latency-regression
    when: {metric: health.latency_ms, agg: p99, window: [[ .latency_window ]], op: ">", baseline: {increase_pct: [[ .p99_increase_pct ]]}, min_value: [[ .p99_min_ms ]], for: 3, reset_after: 2}
baseline: {window: 5m}
phases:
  canary: {observation_window: 5m, warmup: 0s, on_inconclusive: hold}
  rolling: {observation_window: 10m, warmup: 0s, on_inconclusive: hold}
  full: {observation_window: 10m, warmup: 0s, on_inconclusive: pass}
