# Release: push a SemVer tag (git tag v1.0.0 && git push origin v1.0.0).
#   1. binaries (full + minimal) for linux amd64/arm64/ppc64le and windows,
#      CycloneDX SBOMs, rpm/deb, Helm chart     scripts/release.sh build
#   2. multi-arch image pushed to ghcr.io, and per-arch image archives for
#      the air-gapped bundles
#   3. air-gapped bundles and SHA256SUMS         scripts/release.sh bundle
#   4. cosign signature of SHA256SUMS and of the image (key-based, no public
#      transparency log), verified with packaging/cosign.pub
#   5. GitHub release with every artifact
#
# Needs repository secrets COSIGN_PRIVATE_KEY and COSIGN_PASSWORD from
# `cosign generate-key-pair`, and packaging/cosign.pub committed (see
# docs/07-install.md, "Release signing key").
name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write   # create the release
  packages: write   # push the image to ghcr.io

env:
  GO_VERSION: "1.27.2"
  IMAGE: ghcr.io/${{ github.repository_owner }}/vigilante

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.2
      - uses: sigstore/cosign-installer@v3
        with:
          cosign-release: v2.4.1
      - uses: docker/setup-buildx-action@v3

      - name: version from the tag
        id: v
        run: |
          v="${GITHUB_REF_NAME#v}"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          case "$v" in *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;; *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;; esac
          [ -f packaging/cosign.pub ] || { echo "packaging/cosign.pub is missing: commit the release public key first"; exit 1; }

      - name: tests
        run: go test -count=1 ./... && go test -count=1 -tags minimal ./cmd/vigilante ./internal/executor ./internal/probe ./internal/compat

      - name: build binaries, SBOMs, packages, chart
        run: bash scripts/release.sh build "${{ steps.v.outputs.version }}"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: image (push multi-arch, keep per-arch archives for the bundles)
        id: image
        env:
          V: ${{ steps.v.outputs.version }}
        run: |
          docker buildx build -f packaging/container/Dockerfile --build-arg VERSION="$V" \
            --platform linux/amd64,linux/arm64,linux/ppc64le \
            --tag "$IMAGE:$V" --push --metadata-file "$RUNNER_TEMP/meta.json" .
          echo "digest=$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/meta.json")" >> "$GITHUB_OUTPUT"
          mkdir -p "dist/$V/images"
          for arch in amd64 arm64 ppc64le; do
            docker buildx build -f packaging/container/Dockerfile --build-arg VERSION="$V" \
              --platform "linux/$arch" --tag "$IMAGE:$V" \
              --output "type=docker,dest=dist/$V/images/vigilante_${V}_linux_${arch}.tar" .
          done

      - name: air-gapped bundles and checksums
        run: bash scripts/release.sh bundle "${{ steps.v.outputs.version }}"

      - name: sign (and verify with packaging/cosign.pub)
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          bash scripts/release.sh sign "${{ steps.v.outputs.version }}"
          cosign sign --yes --key env://COSIGN_PRIVATE_KEY --tlog-upload=false "$IMAGE@${{ steps.image.outputs.digest }}"
          cosign verify --key packaging/cosign.pub --insecure-ignore-tlog=true "$IMAGE@${{ steps.image.outputs.digest }}" > /dev/null

      - name: publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.v.outputs.version }}
        run: |
          flags=(--title "Vigilante $V" --generate-notes --verify-tag)
          [ "${{ steps.v.outputs.prerelease }}" = true ] && flags+=(--prerelease)
          notes="$RUNNER_TEMP/notes.md"
          {
            echo "Image: \`$IMAGE:$V\` (\`${{ steps.image.outputs.digest }}\`)"
            echo
            echo "Verify before installing (docs/07-install.md):"
            echo '```'
            echo "openssl base64 -d -A -in SHA256SUMS.sig -out SHA256SUMS.der"
            echo "openssl dgst -sha256 -verify cosign.pub -signature SHA256SUMS.der SHA256SUMS"
            echo "sha256sum -c --ignore-missing SHA256SUMS"
            echo '```'
          } > "$notes"
          gh release create "$GITHUB_REF_NAME" "${flags[@]}" --notes-file "$notes" \
            $(find "dist/$V" -maxdepth 1 -type f | sort)
