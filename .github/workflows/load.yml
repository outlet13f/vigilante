# Load test (M5-4): one engine, simulated targets, concurrent deployments,
# some of which go bad. Measures decision latency, wrong verdicts, memory
# and CPU against the non-functional goals (docs/05-roadmap.md):
#   scale-3   2,000 targets x 3 probes, 100 concurrent deployments (must pass)
#   scale-10  2,000 targets x 10 probes, 100 concurrent deployments (the full goal)
# Weekly, on demand, and on pull requests that change the harness or engine.
name: load

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - "test/load/**"
      - "internal/orchestrator/**"
      - "internal/probe/**"
      - "internal/decision/**"
      - ".github/workflows/load.yml"

permissions:
  contents: read

env:
  GO_VERSION: "1.27.2"

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        probes: [3, 10]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: raise the open-file limit (one connection per probe)
        run: ulimit -n 65536 && ulimit -n
      - name: load test (2,000 targets x ${{ matrix.probes }} probes, 100 deployments)
        run: |
          ulimit -n 65536
          go test -tags load ./test/load -run TestLoad -count=1 -timeout 20m -v \
            -args -targets 2000 -deployments 100 -failing 10 -probes ${{ matrix.probes }} \
            -out "load-${{ matrix.probes }}.json" | tee load.log
      - name: summary
        if: always()
        run: |
          {
            echo "### Load: 2,000 targets x ${{ matrix.probes }} probes, 100 deployments"
            echo '```json'
            cat "load-${{ matrix.probes }}.json" 2>/dev/null || tail -50 load.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: load-${{ matrix.probes }}
          path: |
            load-${{ matrix.probes }}.json
            load.log
