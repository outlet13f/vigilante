# CI gates for every pull request and every push to master:
#   test   gofmt, vet, go test -race (PostgreSQL store tests against a real
#          server), cross-builds of the static binary
#   api    OpenAPI lint (Spectral) and, on pull requests, a breaking-change
#          check of the v2 contract against the base branch (oasdiff)
#   vuln   govulncheck: known vulnerabilities reachable from our code
#   package  the release pipeline without publishing: minimal build, rpm/deb,
#          Helm chart, image, air-gapped bundles, signing and installation
#   demo   the end-to-end rollback demo (exit codes of all scenarios)
name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in step with the toolchain line in go.mod.
  GO_VERSION: "1.27.2"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      VIGILANTE_TEST_PG_DSN: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: toolchain matches go.mod
        run: |
          want="go$(sed -n 's/^toolchain go//p' go.mod)"
          got="$(go env GOVERSION)"
          [ "$want" = "$got" ] || { echo "go.mod wants $want, CI runs $got: update GO_VERSION"; exit 1; }
      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          [ -z "$out" ] || { echo "not gofmt-ed:"; echo "$out"; exit 1; }
      - name: vet
        run: go vet ./...
      - name: test (race detector)
        run: go test -race -count=1 -timeout 20m ./...
      - name: cross-build static binaries
        env:
          CGO_ENABLED: "0"
        run: |
          for target in linux/amd64 linux/arm64 linux/ppc64le windows/amd64; do
            GOOS="${target%/*}" GOARCH="${target#*/}" go build -trimpath -o /dev/null ./cmd/vigilante
            echo "built $target"
          done

  api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: lint the OpenAPI spec
        run: npx -y @stoplight/spectral-cli@6.15.0 lint api/openapi.yaml --ruleset .spectral.yaml --fail-severity=warn
      - uses: actions/setup-go@v6
        if: github.event_name == 'pull_request'
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: no breaking changes to the v2 contract
        if: github.event_name == 'pull_request'
        run: |
          if ! git show "origin/${{ github.base_ref }}:api/openapi.yaml" > "$RUNNER_TEMP/base.yaml" 2>/dev/null; then
            echo "base branch has no api/openapi.yaml; nothing to compare"; exit 0
          fi
          go install github.com/oasdiff/oasdiff@v1.33.0
          "$(go env GOPATH)/bin/oasdiff" breaking "$RUNNER_TEMP/base.yaml" api/openapi.yaml --fail-on ERR

  vuln:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          "$(go env GOPATH)/bin/govulncheck" ./...

  package:
    # The release pipeline (release.yml) end to end without publishing:
    # build, image, bundles, signing with a throwaway key, verification, and
    # installing the packages on Debian and Rocky Linux.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      V: 0.0.0-ci.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.2
      - uses: sigstore/cosign-installer@v3
        with:
          cosign-release: v2.4.1
      - uses: docker/setup-buildx-action@v3
      - name: minimal build (vet and tests)
        run: |
          go vet -tags minimal ./...
          go test -count=1 -tags minimal ./cmd/vigilante ./internal/executor ./internal/probe ./internal/compat
      - name: build binaries, SBOMs, packages, chart
        run: bash scripts/release.sh build "$V"
      - name: chart renders (single node and HA)
        run: |
          helm template t deploy/helm/vigilante > /dev/null
          helm template t deploy/helm/vigilante --set replicaCount=3 --set persistence.enabled=false > /dev/null
          if helm template t deploy/helm/vigilante --set replicaCount=3 > /dev/null 2>&1; then
            echo "HA with the file store must be refused"; exit 1
          fi
      - name: image
        run: |
          docker buildx build -f packaging/container/Dockerfile --build-arg VERSION="$V" \
            --platform linux/amd64 --tag "vigilante:$V" --load .
          docker run --rm "vigilante:$V" version | grep -q "vigilante $V (full build"
          mkdir -p "dist/$V/images"
          docker save "vigilante:$V" -o "dist/$V/images/vigilante_${V}_linux_amd64.tar"
      - name: bundles, signature, verification
        run: |
          bash scripts/release.sh bundle "$V"
          export COSIGN_PASSWORD=ci
          cosign generate-key-pair --output-key-prefix "$RUNNER_TEMP/ci"
          export COSIGN_PRIVATE_KEY="$(cat "$RUNNER_TEMP/ci.key")"
          mv packaging/cosign.pub "$RUNNER_TEMP/release.pub" 2>/dev/null || true
          bash scripts/release.sh sign "$V"
          bash scripts/release.sh verify "$V" "$RUNNER_TEMP/ci.pub"
      - name: install the deb and the rpm
        run: |
          for img in debian:12 rockylinux:9; do
            docker run --rm -v "$PWD/dist/$V:/d:ro" "$img" sh -ec '
              tar -C /tmp -xzf /d/vigilante_*_airgap_linux_amd64.tar.gz
              cd /tmp/vigilante_*_airgap_linux_amd64
              ./install.sh
              id vigilante
              test -f /usr/lib/systemd/system/vigilante-server.service
              vigilante validate -c /etc/vigilante/vigilante.yaml
              stat -c "%U:%G %a" /var/lib/vigilante /etc/vigilante/vigilante.yaml'
          done

  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: end-to-end rollback demo
        run: bash examples/demo/run-demo.sh
