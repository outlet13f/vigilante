# Local end-to-end demo: one fake service instance on 127.0.0.1:18080.
# Run ./examples/demo/run-demo.sh from the repository root.
#
# The service is declared with the built-in java-web preset; see what it
# expands to with:  vigilante presets show java-web
version: v1
server:
  journal_path: examples/demo/run/journal.jsonl

targets:
  - name: demo-app
    kind: vm
    address: 127.0.0.1
    connection: {type: local}

executors:
  # Hands the rollback to the app's own deploy endpoint (stand-in for an
  # in-house deploy console). DEMO_ROLLBACK_HOST lets the demo break it on purpose.
  deploy-api:
    type: webhook
    webhook:
      url: 'http://{{env "DEMO_ROLLBACK_HOST"}}/admin/deploy?version={{.PreviousVersion}}'
      verify_url: 'http://{{env "DEMO_ROLLBACK_HOST"}}/admin/version?expect={{.PreviousVersion}}'

services:
  - name: demo
    targets: [demo-app]
    preset: java-web@1
    overrides:
      health_url: "http://{{.Address}}:18080/health"
      access_log: examples/demo/run/access.log
      app_log: examples/demo/run/app.log
      window: 10s           # short windows so the demo runs in about a minute
      latency_window: 10s
      p99_min_ms: 15        # the fake app answers in single-digit milliseconds
      host_probe: false     # no /proc on Windows
    # Replaces the preset's health probe (same id): a faster check for the demo.
    probes:
      - id: health
        type: http
        interval: 500ms
        timeout: 1s
        http: {url: "http://{{.Address}}:18080/health", json_path: status, json_expect: UP}
    baseline: {window: 10s, min_samples: 20}
    phases:
      canary: {observation_window: 20s, warmup: 3s, eval_interval: 1s, min_samples: 20}
    rollback:
      mode: auto            # the demo shows automatic rollback
      executor: deploy-api
      step_timeout: 10s
      retry: {attempts: 2, backoff: 500ms}
      plan:
        - action: app.rollback
        - action: app.verify
        - {action: probe.verify, probe: health, successes: 3}

safety:
  circuit_breaker: {failure_threshold: 1, window: 1h, open_duration: 0s}
  flapping: {max_rollbacks_per_hour: 10}
