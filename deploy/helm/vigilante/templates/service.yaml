apiVersion: v1
kind: Service
metadata:
  name: {{ include "vigilante.fullname" . }}
  labels:
    {{- include "vigilante.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    {{- $scheme := include "vigilante.scheme" . }}
    - {name: {{ $scheme }}, port: {{ .Values.service.port }}, targetPort: {{ $scheme }}, protocol: TCP, appProtocol: {{ $scheme }}}
  selector:
    {{- include "vigilante.selector" . | nindent 4 }}
