openapi: 3.1.0
info:
  title: Vigilante API
  version: 2.0.0
  summary: Deployment health gate and automatic rollback orchestrator.
  description: |
    The Vigilante API is the only interface of the server: the CLI remote mode,
    the operations console and on-host agents use it like any integration.

    **Versions.** `/v2` is the public contract. Minor releases only add
    (fields, resources, optional parameters); a breaking change gets a new
    major version. Retired endpoints carry `Deprecation` and `Sunset` headers
    for at least six months. `/v1` remains for existing CI integrations.

    **Errors.** Every v2 error is `application/problem+json` (RFC 9457) with a
    stable machine-readable `code` and the `request_id` to quote to operators.

    **Retries.** Send an `Idempotency-Key` header on every POST. A retry with
    the same key and the same body returns the first response (marked
    `Idempotent-Replayed: true`) instead of starting a second rollback. Keys
    are kept for 24 hours per caller.

    **Long-running work.** Observing a phase, rolling back, approving an
    escalation and capturing a baseline answer `202 Accepted` with an
    `Operation` and a `Location` header. Poll the operation until its
    `status` is no longer `running`.

    **Paging.** Lists return `{items, next_cursor}`. Pass `next_cursor` back as
    `cursor` until it is null. Cursors are opaque.

    **Time and IDs.** Timestamps are RFC 3339 in UTC. IDs are opaque strings.

    **Events.** State changes are published as CloudEvents 1.0 with a
    cluster-wide `sequence`: stream them from `/v2/events` (SSE, resumable with
    `Last-Event-ID`) or subscribe a URL with `/v2/webhooks`. Deliveries are at
    least once and in order per subscription, signed per Standard Webhooks
    (`webhook-id`, `webhook-timestamp`, `webhook-signature: v1,<base64 HMAC-SHA256
    of "id.timestamp.body">`); deduplicate by `webhook-id`.
  contact:
    name: Vigilante maintainers
    url: https://github.com/outlet13f/vigilante
  license:
    name: Proprietary (internal use)
    identifier: LicenseRef-Internal
servers:
  - url: https://vigilante.example.internal:8088
    description: Any node of the cluster; followers forward to the leader.
security:
  - bearerAuth: []
  - oauth2: []
tags:
  - name: deployments
    description: Releases being watched, and the actions taken on them.
  - name: operations
    description: Progress of accepted long-running requests.
  - name: services
    description: Services, their targets and presets (read from configuration).
  - name: safety
    description: The global circuit breaker (emergency stop) and change freezes.
  - name: events
    description: Event catalog, live stream (SSE) and webhook subscriptions.
  - name: audit
    description: Who did what, with a tamper-evident hash chain.
  - name: identity
    description: The caller as the server sees it, OAuth tokens and API clients.
  - name: system
    description: Health, readiness and metrics of the node.
  - name: v1
    description: Version 1 endpoints kept for existing CI integrations.

paths:
  /v2/me:
    get:
      tags: [identity]
      operationId: getMe
      summary: Describe the caller
      responses:
        '200':
          description: The authenticated principal and its grants.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Principal'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '429': {$ref: '#/components/responses/RateLimited'}

  /v2/deployments:
    get:
      tags: [deployments]
      operationId: listDeployments
      security: [{bearerAuth: []}, {oauth2: [deployments:read]}]
      summary: List deployments
      description: Newest first. Only deployments of services the caller may read are listed.
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
        - name: service
          in: query
          schema: {type: string}
        - name: state
          in: query
          schema: {$ref: '#/components/schemas/DeploymentState'}
      responses:
        '200':
          description: One page of deployments.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeploymentPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '429': {$ref: '#/components/responses/RateLimited'}
    post:
      tags: [deployments]
      operationId: createDeployment
      security: [{bearerAuth: []}, {oauth2: [deployments:write]}]
      summary: Register a deployment
      description: |
        Registers a release before (or right after) it is rolled out. When
        `previous_version` is omitted the service's last good version is used;
        without one the request is rejected, because a rollback target is required.
        During a change freeze new deployments get `409` with code
        `change_frozen`, unless an admin sends `freeze_override`. Where a
        ServiceNow change gate applies, `change_ticket` must name an approved
        change in an allowed state and inside its planned window
        (`409 change_ticket_invalid`); if ServiceNow cannot be reached and the
        gate fails closed, the answer is `503 itsm_unavailable`.
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DeploymentCreate'}
      responses:
        '200':
          description: A deployment with this `id`, service and version already exists; it is returned unchanged.
          headers:
            Location: {$ref: '#/components/headers/Location'}
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Deployment'}
        '201':
          description: Created.
          headers:
            Location: {$ref: '#/components/headers/Location'}
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Deployment'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '503': {$ref: '#/components/responses/ITSMUnavailable'}

  /v2/deployments/{id}:
    parameters:
      - {$ref: '#/components/parameters/DeploymentID'}
    get:
      tags: [deployments]
      operationId: getDeployment
      security: [{bearerAuth: []}, {oauth2: [deployments:read]}]
      summary: Get a deployment
      parameters:
        - {$ref: '#/components/parameters/IfNoneMatch'}
      responses:
        '200':
          description: The deployment with its timeline, breaches and last evaluation.
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Deployment'}
        '304': {description: Not modified since the ETag in If-None-Match.}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

  /v2/deployments/{id}/observations:
    parameters:
      - {$ref: '#/components/parameters/DeploymentID'}
    post:
      tags: [deployments]
      operationId: startObservation
      security: [{bearerAuth: []}, {oauth2: [deployments:write]}]
      summary: Observe a phase
      description: |
        Starts watching one phase. A failing phase is rolled back automatically
        (or, with `rollback.mode: approve`, waits for a decision); the operation
        result carries the final state and the CI exit code. While the circuit
        breaker is open (`circuit_open`) or a change freeze applies
        (`change_frozen`, unless the deployment was created with an override)
        the request gets `409`.
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/IfMatch'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ObservationRequest'}
      responses:
        '202': {$ref: '#/components/responses/Accepted'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '503': {$ref: '#/components/responses/ITSMUnavailable'}

  /v2/deployments/{id}/rollbacks:
    parameters:
      - {$ref: '#/components/parameters/DeploymentID'}
    post:
      tags: [deployments]
      operationId: startRollback
      security: [{bearerAuth: []}, {oauth2: [rollbacks:execute]}]
      summary: Roll back now
      description: |
        Operator decision. Cancels a running observation and runs the rollback
        plan. Bypasses the flapping guard and the circuit breaker but still
        takes the per-service lock.
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/IfMatch'}
      requestBody:
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RollbackRequest'}
      responses:
        '202': {$ref: '#/components/responses/Accepted'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '422': {$ref: '#/components/responses/Unprocessable'}

  /v2/deployments/{id}/approvals:
    parameters:
      - {$ref: '#/components/parameters/DeploymentID'}
    post:
      tags: [deployments]
      operationId: approveEscalation
      security: [{bearerAuth: []}, {oauth2: [approvals:write]}]
      summary: Approve or reject a waiting rollback
      description: |
        Allowed only while the deployment is `AWAITING_APPROVAL`, which happens
        in two cases:

        * a phase failed for a service with `rollback.mode: approve`; the
          prepared rollback (`pending_rollback`) runs when approved, and a
          rejection keeps the new version, puts drained targets back into
          traffic and holds the deployment;
        * an escalation step marked `require_approval` (such as a VM snapshot
          restore) is next; it can only be approved.

        With four-eyes enabled the decider must differ from whoever created the
        deployment or requested its rollback.
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/IfMatch'}
      requestBody:
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ApprovalRequest'}
      responses:
        '202': {$ref: '#/components/responses/Accepted'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '422': {$ref: '#/components/responses/Unprocessable'}

  /v2/deployments/{id}/feedback:
    parameters:
      - {$ref: '#/components/parameters/DeploymentID'}
    put:
      tags: [deployments]
      operationId: setDeploymentFeedback
      security: [{bearerAuth: []}, {oauth2: [deployments:write]}]
      summary: Assess the verdict
      description: |
        Records whether the verdict was right, for measuring decision quality
        (false positives and false negatives). Replaces an earlier assessment.
        `false_positive` needs a FAIL verdict; `false_negative` needs none.
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FeedbackRequest'}
      responses:
        '200':
          description: The deployment with its feedback.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Deployment'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /v2/deployments/{id}/abort:
    parameters:
      - {$ref: '#/components/parameters/DeploymentID'}
    post:
      tags: [deployments]
      operationId: abortObservation
      security: [{bearerAuth: []}, {oauth2: [deployments:write]}]
      summary: Stop observing
      description: Cancels a running observation. A rollback already running is not interrupted.
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AbortRequest'}
      responses:
        '200':
          description: The deployment after the abort request.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Deployment'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Unprocessable'}

  /v2/operations:
    get:
      tags: [operations]
      operationId: listOperations
      security: [{bearerAuth: []}, {oauth2: [deployments:read]}]
      summary: List operations
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
        - name: deployment_id
          in: query
          schema: {type: string}
        - name: status
          in: query
          schema: {$ref: '#/components/schemas/OperationStatus'}
      responses:
        '200':
          description: One page of operations, newest first.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OperationPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '429': {$ref: '#/components/responses/RateLimited'}

  /v2/operations/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
    get:
      tags: [operations]
      operationId: getOperation
      security: [{bearerAuth: []}, {oauth2: [deployments:read]}]
      summary: Get an operation
      parameters:
        - {$ref: '#/components/parameters/IfNoneMatch'}
      responses:
        '200':
          description: The operation.
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Operation'}
        '304': {description: Not modified since the ETag in If-None-Match.}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

  /v2/services:
    get:
      tags: [services]
      operationId: listServices
      security: [{bearerAuth: []}, {oauth2: [deployments:read]}]
      summary: List services
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
        - name: team
          in: query
          schema: {type: string}
      responses:
        '200':
          description: One page of services the caller may read, by name.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ServicePage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '429': {$ref: '#/components/responses/RateLimited'}

  /v2/services/{name}:
    parameters:
      - {$ref: '#/components/parameters/ServiceName'}
    get:
      tags: [services]
      operationId: getService
      security: [{bearerAuth: []}, {oauth2: [deployments:read]}]
      summary: Get a service
      responses:
        '200':
          description: The service.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Service'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

  /v2/services/{name}/baselines:
    parameters:
      - {$ref: '#/components/parameters/ServiceName'}
    post:
      tags: [services]
      operationId: captureBaseline
      security: [{bearerAuth: []}, {oauth2: [deployments:write]}]
      summary: Capture a baseline
      description: Observes the running (old) version for the window and keeps the result as the comparison baseline.
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BaselineRequest'}
      responses:
        '202': {$ref: '#/components/responses/Accepted'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Unprocessable'}

  /v2/services/{name}/last-good:
    parameters:
      - {$ref: '#/components/parameters/ServiceName'}
    put:
      tags: [services]
      operationId: setLastGood
      security: [{bearerAuth: []}, {oauth2: [deployments:write]}]
      summary: Register the known-good version
      description: The version rollbacks return to when a deployment does not name `previous_version`.
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LastGoodRequest'}
      responses:
        '200':
          description: Registered.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LastGood'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Unprocessable'}
    get:
      tags: [services]
      operationId: getLastGood
      security: [{bearerAuth: []}, {oauth2: [deployments:read]}]
      summary: Get the known-good version
      responses:
        '200':
          description: The last good version.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LastGood'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

  /v2/targets:
    get:
      tags: [services]
      operationId: listTargets
      security: [{bearerAuth: []}, {oauth2: [deployments:read]}]
      summary: List targets
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: One page of targets belonging to services the caller may read.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TargetPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '429': {$ref: '#/components/responses/RateLimited'}

  /v2/targets/{name}:
    parameters:
      - name: name
        in: path
        required: true
        schema: {type: string}
    get:
      tags: [services]
      operationId: getTarget
      security: [{bearerAuth: []}, {oauth2: [deployments:read]}]
      summary: Get a target
      responses:
        '200':
          description: The target.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Target'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

  /v2/presets:
    get:
      tags: [services]
      operationId: listPresets
      summary: List rule presets
      responses:
        '200':
          description: Built-in and organisation presets.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/Preset'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '429': {$ref: '#/components/responses/RateLimited'}

  /v2/circuit:
    get:
      tags: [safety]
      operationId: getCircuit
      security: [{bearerAuth: []}, {oauth2: [deployments:read]}]
      summary: Circuit breaker state
      responses:
        '200':
          description: Current state.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Circuit'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '403': {$ref: '#/components/responses/Forbidden'}

  /v2/circuit/reset:
    post:
      tags: [safety]
      operationId: resetCircuit
      security: [{bearerAuth: []}, {oauth2: [circuit:admin]}]
      summary: Close the circuit
      description: Admin only. Re-enables automatic rollbacks and the deployment gate after investigation.
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CircuitRequest'}
      responses:
        '200':
          description: State after the reset.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Circuit'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/Unprocessable'}

  /v2/circuit/trip:
    post:
      tags: [safety]
      operationId: tripCircuit
      security: [{bearerAuth: []}, {oauth2: [circuit:admin]}]
      summary: Open the circuit (kill switch)
      description: Admin only. Freezes every automatic destructive action and closes the deployment gate.
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CircuitRequest'}
      responses:
        '200':
          description: State after the trip.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Circuit'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/Unprocessable'}

  /v2/freezes:
    get:
      tags: [safety]
      operationId: listFreezes
      summary: List change freezes
      description: Config windows (`config:<name>`, weekly or absolute) and freezes declared through the API that have not ended.
      security: [{bearerAuth: []}, {oauth2: [deployments:read]}]
      responses:
        '200':
          description: Freeze windows.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/FreezeWindow'}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
    post:
      tags: [safety]
      operationId: createFreeze
      summary: Declare a change freeze
      description: |
        Admin only. New deployments and phase starts of the covered services
        are refused until `ends_at`. Automatic rollback stays allowed unless
        `allow_rollback` is false; manual rollback always is.
      security: [{bearerAuth: []}, {oauth2: [config:write]}]
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FreezeCreate'}
      responses:
        '201':
          description: Declared.
          headers:
            Location: {$ref: '#/components/headers/Location'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Freeze'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/RateLimited'}

  /v2/freezes/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
    delete:
      tags: [safety]
      operationId: endFreeze
      summary: End a declared freeze early
      description: Admin only. Config windows end by changing the config.
      security: [{bearerAuth: []}, {oauth2: [config:write]}]
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '200':
          description: Ended.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Freeze'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}

  /v2/audit-events:
    get:
      tags: [audit]
      operationId: listAuditEvents
      security: [{bearerAuth: []}, {oauth2: [audit:read]}]
      summary: Query the audit trail
      description: Oldest first. Needs `viewer` on every service (`*`), because entries span services.
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
        - name: since
          in: query
          schema: {type: string, format: date-time}
        - name: until
          in: query
          schema: {type: string, format: date-time}
        - name: actor
          in: query
          schema: {type: string}
        - name: action
          in: query
          schema: {type: string}
        - name: service
          in: query
          schema: {type: string}
      responses:
        '200':
          description: One page of audit events.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuditEventPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '403': {$ref: '#/components/responses/Forbidden'}

  /v2/oauth/token:
    post:
      tags: [identity]
      operationId: issueToken
      summary: Get an access token (OAuth 2.0 client credentials)
      description: |
        RFC 6749 section 4.4. Authenticate the client with HTTP Basic (or
        `client_id` / `client_secret` form fields). Errors use the OAuth error
        format of RFC 6749 section 5.2, so standard OAuth libraries work. Tokens
        stop working when the client's secret is rotated or the client is revoked.
      security: [{clientBasic: []}, {}]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [grant_type]
              properties:
                grant_type: {type: string, enum: [client_credentials]}
                scope: {type: string, description: 'Space-separated subset of the client scopes. Defaults to all of them.'}
                client_id: {type: string}
                client_secret: {type: string}
      responses:
        '200':
          description: Access token.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TokenResponse'}
        '400':
          description: Invalid request, unsupported grant type or scope.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OAuthError'}
        '401':
          description: Client authentication failed.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OAuthError'}
        '429':
          description: Rate limited.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OAuthError'}

  /v2/api-clients:
    get:
      tags: [identity]
      operationId: listApiClients
      summary: List API clients
      security: [{bearerAuth: []}, {oauth2: [config:write]}]
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: One page of clients, by name.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiClientPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
    post:
      tags: [identity]
      operationId: createApiClient
      summary: Register an API client
      description: |
        Admin only. The response carries the secret (OAuth client secret or API
        key) once; only its SHA-256 is stored. Not replayable with
        Idempotency-Key, because the stored response would contain the secret;
        a retry gets 409 while a client of that name is active.
      security: [{bearerAuth: []}, {oauth2: [config:write]}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ApiClientCreate'}
      responses:
        '201':
          description: Created; store the secret now.
          headers:
            Location: {$ref: '#/components/headers/Location'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiClientSecret'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/RateLimited'}

  /v2/api-clients/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
    get:
      tags: [identity]
      operationId: getApiClient
      summary: Get an API client
      security: [{bearerAuth: []}, {oauth2: [config:write]}]
      responses:
        '200':
          description: The client (never its secret).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiClient'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}
    patch:
      tags: [identity]
      operationId: updateApiClient
      summary: Change scopes, grants, expiry or rate limit
      security: [{bearerAuth: []}, {oauth2: [config:write]}]
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ApiClientUpdate'}
      responses:
        '200':
          description: The updated client.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiClient'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/RateLimited'}
    delete:
      tags: [identity]
      operationId: revokeApiClient
      summary: Revoke an API client
      description: The client and every token issued to it stop working at once. The record is kept for the audit trail.
      security: [{bearerAuth: []}, {oauth2: [config:write]}]
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '200':
          description: The revoked client.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiClient'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}

  /v2/api-clients/{id}/secret:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
    post:
      tags: [identity]
      operationId: rotateApiClientSecret
      summary: Rotate the secret
      description: Issues a new secret; the old secret and tokens issued with it stop working at once.
      security: [{bearerAuth: []}, {oauth2: [config:write]}]
      responses:
        '200':
          description: The new secret, shown once.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiClientSecret'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/RateLimited'}

  /v2/events:
    get:
      tags: [events]
      operationId: streamEvents
      summary: Stream events (Server-Sent Events)
      description: |
        `text/event-stream`: each message has `id` (the event sequence), `event`
        (the type) and `data` (the CloudEvent as JSON). Reconnect with
        `Last-Event-ID` (browsers do this automatically) to receive every event
        missed while disconnected that is still kept (the last 10,000), then the
        live stream. Without it the stream starts with new events. Only events of
        services the caller may read are sent; events of no service (circuit,
        agents) need viewer on any service. A keep-alive comment is sent every 15s.
      security: [{bearerAuth: []}, {oauth2: [deployments:read]}]
      parameters:
        - name: Last-Event-ID
          in: header
          schema: {type: string, pattern: '^[0-9]+$'}
        - name: after
          in: query
          description: Same as Last-Event-ID, for clients that cannot set headers.
          schema: {type: integer, minimum: 0}
        - name: types
          in: query
          description: Comma-separated event types.
          schema: {type: string}
        - name: service
          in: query
          schema: {type: string}
      responses:
        '200':
          description: The event stream.
          content:
            text/event-stream:
              schema: {type: string}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}

  /v2/event-types:
    get:
      tags: [events]
      operationId: listEventTypes
      summary: Event catalog
      responses:
        '200':
          description: Every event type with its meaning.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [type, description]
                      properties:
                        type: {type: string}
                        description: {type: string}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '429': {$ref: '#/components/responses/RateLimited'}

  /v2/webhooks:
    get:
      tags: [events]
      operationId: listWebhooks
      summary: List webhook subscriptions
      description: The caller's own subscriptions; admins see all.
      security: [{bearerAuth: []}, {oauth2: [config:write]}]
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: One page of subscriptions, oldest first.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WebhookPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '429': {$ref: '#/components/responses/RateLimited'}
    post:
      tags: [events]
      operationId: createWebhook
      summary: Subscribe to events
      description: |
        Deliveries start with the next event. The caller needs viewer on every
        service and team the subscription covers (on `*` when unfiltered). The
        response carries the signing secret once; it is derived from the server
        key and never stored. Not replayable with Idempotency-Key (the stored
        response would contain the secret).
      security: [{bearerAuth: []}, {oauth2: [config:write]}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WebhookCreate'}
      responses:
        '201':
          description: Subscribed; store the secret now.
          headers:
            Location: {$ref: '#/components/headers/Location'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WebhookSecret'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/RateLimited'}

  /v2/webhooks/{id}:
    parameters:
      - {$ref: '#/components/parameters/WebhookID'}
    get:
      tags: [events]
      operationId: getWebhook
      summary: Get a subscription (with its dead letters)
      security: [{bearerAuth: []}, {oauth2: [config:write]}]
      responses:
        '200':
          description: The subscription.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Webhook'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}
    patch:
      tags: [events]
      operationId: updateWebhook
      summary: Change or re-enable a subscription
      description: Setting `active` to true after an automatic disable clears the failure count; delivery resumes from the cursor.
      security: [{bearerAuth: []}, {oauth2: [config:write]}]
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WebhookUpdate'}
      responses:
        '200':
          description: The updated subscription.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Webhook'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/RateLimited'}
    delete:
      tags: [events]
      operationId: deleteWebhook
      summary: Unsubscribe
      security: [{bearerAuth: []}, {oauth2: [config:write]}]
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '204': {description: Deleted.}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}

  /v2/webhooks/{id}/secret:
    parameters:
      - {$ref: '#/components/parameters/WebhookID'}
    post:
      tags: [events]
      operationId: rotateWebhookSecret
      summary: Rotate the signing secret
      description: Deliveries are signed with the new secret from now on.
      security: [{bearerAuth: []}, {oauth2: [config:write]}]
      responses:
        '200':
          description: The new secret, shown once.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WebhookSecret'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}

  /v2/webhooks/{id}/deliveries:
    parameters:
      - {$ref: '#/components/parameters/WebhookID'}
    get:
      tags: [events]
      operationId: listWebhookDeliveries
      summary: Recent delivery attempts
      description: The last 100 attempts on this node, newest first.
      security: [{bearerAuth: []}, {oauth2: [config:write]}]
      responses:
        '200':
          description: Attempts.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/Delivery'}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}

  /v2/webhooks/{id}/redeliveries:
    parameters:
      - {$ref: '#/components/parameters/WebhookID'}
    post:
      tags: [events]
      operationId: redeliverEvent
      summary: Send a kept event again
      description: Typically for an entry of the dead-letter list, which it removes from the list.
      security: [{bearerAuth: []}, {oauth2: [config:write]}]
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sequence]
              additionalProperties: false
              properties:
                sequence: {type: integer, minimum: 1}
      responses:
        '202':
          description: Queued.
          content:
            application/json:
              schema:
                type: object
                required: [queued, sequence]
                properties:
                  queued: {type: boolean}
                  sequence: {type: integer}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/RateLimited'}

  /v2/webhooks/{id}/pings:
    parameters:
      - {$ref: '#/components/parameters/WebhookID'}
    post:
      tags: [events]
      operationId: pingWebhook
      summary: Send a test event
      description: Publishes a `vigilante.ping` event that only this subscription receives.
      security: [{bearerAuth: []}, {oauth2: [config:write]}]
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '202':
          description: The test event, queued for delivery.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CloudEvent'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503':
          description: This node cannot publish right now (not the leader).
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}

  /healthz:
    get:
      tags: [system]
      operationId: health
      summary: Liveness
      security: []
      responses:
        '200':
          description: The process is serving.
          content:
            application/json:
              schema: {type: object}
  /readyz:
    get:
      tags: [system]
      operationId: ready
      summary: Readiness
      security: []
      responses:
        '200':
          description: Ready.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Readiness'}
        '503':
          description: Not ready (state store unreachable, or no HA leader known).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Readiness'}
  /metrics:
    get:
      tags: [system]
      operationId: metrics
      security: [{bearerAuth: []}, {oauth2: [deployments:read]}]
      summary: Prometheus metrics
      description: Needs `viewer` on `*` unless `server.metrics_public` is set.
      responses:
        '200':
          description: Text exposition format 0.0.4.
          content:
            text/plain:
              schema: {type: string}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}

