webhooks:
  event:
    post:
      summary: Event delivery to a subscribed URL
      description: |
        One event per request. Answer 2xx within 10 seconds to acknowledge.
        Anything else is retried after 1s, 5s, 30s, 2m, 10m and 30m; after the
        last retry the event goes to the subscription's dead-letter list. Five
        dead letters in a row disable the subscription and alert operators.
        Redirects are not followed.
      parameters:
        - name: webhook-id
          in: header
          required: true
          description: Event sequence; the same on every retry. Deduplicate by it.
          schema: {type: string}
        - name: webhook-timestamp
          in: header
          required: true
          description: Unix seconds; reject old ones to stop replays.
          schema: {type: string}
        - name: webhook-signature
          in: header
          required: true
          description: 'v1,<base64 HMAC-SHA256 over "webhook-id.webhook-timestamp.body">, keyed with the base64-decoded part of the whsec_ secret.'
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/cloudevents+json:
            schema: {$ref: '#/components/schemas/CloudEvent'}
      responses:
        '200': {description: Acknowledged (any 2xx).}

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        A service-account token (`vgl_…`), an API key (`vgk_…`), or an OIDC
        access token from the corporate identity provider.
    oauth2:
      type: oauth2
      description: |
        Client credentials grant for server-to-server integrations. Exchange the
        client ID and secret at `/v2/oauth/token` for a bearer token (`vat_…`).
        Scopes narrow what the client may do; its role grants decide where.
      flows:
        clientCredentials:
          tokenUrl: /v2/oauth/token
          scopes:
            deployments:read: Read deployments, operations, services, targets, circuit and metrics.
            deployments:write: Register deployments, observe phases, abort, baselines, last good version.
            rollbacks:execute: Start manual rollbacks.
            approvals:write: Approve gated escalations.
            circuit:admin: Reset or trip the circuit breaker.
            audit:read: Read the audit trail.
            metrics:write: Push samples (agents, external monitoring).
            config:write: Manage API clients and server configuration.
    clientBasic:
      type: http
      scheme: basic
      description: OAuth client authentication at the token endpoint (client ID and secret).

  parameters:
    Limit:
      name: limit
      in: query
      description: Page size.
      schema: {type: integer, minimum: 1, maximum: 500, default: 50}
    Cursor:
      name: cursor
      in: query
      description: The `next_cursor` of the previous page.
      schema: {type: string}
    DeploymentID:
      name: id
      in: path
      required: true
      schema: {type: string}
    ServiceName:
      name: name
      in: path
      required: true
      schema: {type: string}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: Unique per logical request (e.g. a UUID). Retries reuse it.
      schema: {type: string, minLength: 1, maxLength: 255}
    IfMatch:
      name: If-Match
      in: header
      description: Act only if the deployment still has this ETag.
      schema: {type: string}
    WebhookID:
      name: id
      in: path
      required: true
      schema: {type: string}
    IfNoneMatch:
      name: If-None-Match
      in: header
      schema: {type: string}

  headers:
    Location:
      description: URL of the created resource or accepted operation.
      schema: {type: string}
    ETag:
      description: Version tag of the representation.
      schema: {type: string}

  responses:
    Accepted:
      description: Accepted; poll the operation.
      headers:
        Location: {$ref: '#/components/headers/Location'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Operation'}
    BadRequest:
      description: Malformed request.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Unauthenticated:
      description: Missing or invalid credentials.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Forbidden:
      description: The caller's roles do not allow this on this service.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    NotFound:
      description: No such resource.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Conflict:
      description: The resource is in a state that does not allow this (or the same Idempotency-Key is still being processed).
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    PreconditionFailed:
      description: If-Match did not match the current ETag.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    ITSMUnavailable:
      description: The change ticket could not be verified because the ITSM system is unreachable, and the change gate fails closed.
      headers:
        Retry-After:
          schema: {type: integer}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    RateLimited:
      description: |
        Too many requests from this caller. Rollbacks, approvals, abort and the
        circuit breaker use a separate bucket, so reads never exhaust them.
      headers:
        Retry-After:
          description: Seconds to wait.
          schema: {type: integer}
        RateLimit-Limit:
          schema: {type: integer}
        RateLimit-Remaining:
          schema: {type: integer}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Unprocessable:
      description: Well-formed but invalid (validation, or an Idempotency-Key reused with a different request).
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}

  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details.
      required: [type, title, status, code]
      properties:
        type: {type: string, description: 'URI identifying the problem type.'}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        code:
          type: string
          description: |
            Stable machine-readable error code. The set grows over time: treat
            an unknown code like the generic error for its HTTP status.
          x-extensible-enum: [bad_request, validation_failed, unauthenticated, forbidden, not_found, conflict,
                 precondition_failed, idempotency_key_reused, idempotency_key_in_flight,
                 not_leader, rate_limited, internal, change_frozen, circuit_open,
                 change_ticket_invalid, itsm_unavailable]
        request_id: {type: string}
        errors:
          type: array
          items:
            type: object
            required: [message]
            properties:
              field: {type: string}
              message: {type: string}

    Principal:
      type: object
      required: [id, kind, grants]
      properties:
        id: {type: string, examples: ['user:alice', 'sa:ci-order', 'client:deploy-console']}
        kind: {type: string, x-extensible-enum: [user, service, client, legacy, webhook, anonymous]}
        scopes: {type: [array, 'null'], items: {type: string}, description: 'OAuth scopes of an API client; null = not scope-limited.'}
        groups: {type: [array, 'null'], items: {type: string}}
        grants:
          type: array
          items: {type: string, examples: ['deployer@team=payments']}

    DeploymentState:
      type: string
      enum: [PENDING, BASELINE, OBSERVING, PROMOTED, SUCCEEDED, HELD, ROLLING_BACK, ROLLED_BACK,
             ROLLBACK_FAILED, AWAITING_APPROVAL, ABORTED]
    DeploymentStateValue:
      type: string
      description: A deployment state in a response. New states may be added; treat an unknown one as "in progress".
      x-extensible-enum: [PENDING, BASELINE, OBSERVING, PROMOTED, SUCCEEDED, HELD, ROLLING_BACK, ROLLED_BACK,
                          ROLLBACK_FAILED, AWAITING_APPROVAL, ABORTED]
    ScopeValue:
      type: string
      description: A scope in a response. New scopes may be added.
      x-extensible-enum: [deployments:read, deployments:write, rollbacks:execute, approvals:write, circuit:admin, audit:read, metrics:write, config:write]
    Verdict:
      type: string
      enum: [PENDING, PASS, FAIL, HOLD, INCONCLUSIVE]
    Phase:
      type: string
      enum: [canary, rolling, full]

    DeploymentCreate:
      type: object
      required: [service, version]
      additionalProperties: false
      properties:
        id: {type: string, description: 'Optional client-chosen ID (e.g. the CI run). Generated when omitted.', maxLength: 128}
        service: {type: string}
        version: {type: string}
        previous_version: {type: string, description: 'Rollback target. Defaults to the last good version.'}
        prepare: {type: boolean, default: false, description: 'Record executor checkpoints (current release, image, snapshot) now.'}
        freeze_override:
          type: string
          maxLength: 1000
          description: Admins only. The reason this deployment may proceed during a change freeze; recorded in the audit trail.
        change_ticket:
          type: string
          maxLength: 64
          description: 'ITSM change number (e.g. CHG0012345), required where a change gate applies. The X-Change-Ticket header works too.' 

    Deployment:
      type: object
      required: [id, service, version, previous_version, state, verdict, exit_code, created_at, updated_at]
      properties:
        id: {type: string}
        service: {type: string}
        version: {type: string}
        previous_version: {type: string}
        phase: {type: string}
        state: {$ref: '#/components/schemas/DeploymentStateValue'}
        verdict: {$ref: '#/components/schemas/Verdict'}
        reason: {type: string}
        exit_code:
          type: integer
          description: 'CI contract: 0 passed, 1 error, 2 rolled back, 3 rollback failed or approval needed, 4 held.'
          enum: [0, 1, 2, 3, 4]
        targets: {type: [array, 'null'], items: {type: string}}
        breaches: {type: array, items: {$ref: '#/components/schemas/Breach'}}
        events: {type: array, items: {$ref: '#/components/schemas/Event'}}
        created_by: {type: string}
        rollback_requested_by: {type: string}
        approved_by: {type: string}
        freeze_override: {type: string, description: 'Why, and by whom, this deployment may proceed during a change freeze.'}
        change_ticket:
          type: object
          description: The ITSM change this deployment runs under.
          required: [number, checked_at]
          properties:
            number: {type: string}
            sys_id: {type: string}
            state: {type: string}
            approval: {type: string}
            checked_at: {type: string, format: date-time}
            unverified: {type: boolean, description: 'ITSM was unreachable and the gate fails open.'}
        dry_run: {type: boolean, description: 'Ran with dry_run: rollbacks were only logged.'}
        feedback: {$ref: '#/components/schemas/Feedback'}
        pending_rollback:
          type: object
          description: The rollback prepared for a failed phase, waiting for a decision (approve mode).
          required: [reason, targets, requested_at, expires_at]
          properties:
            reason: {type: string}
            targets: {type: array, items: {type: string}}
            drained: {type: array, items: {type: string}, description: 'Taken out of traffic while waiting (drain_first).'}
            requested_at: {type: string, format: date-time}
            expires_at: {type: string, format: date-time}
            detected_at: {type: string, format: date-time}
            escalated: {type: boolean, description: 'The timeout passed and operators were alerted again.'}
        last_evaluation: {$ref: '#/components/schemas/Evaluation'}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    Breach:
      type: object
      required: [rule, target, action]
      properties:
        rule: {type: string}
        target: {type: string}
        detail: {type: string}
        action: {type: string}
        environmental: {type: boolean}
        value: {type: number}
    Event:
      type: object
      required: [time, kind, message]
      properties:
        time: {type: string, format: date-time}
        kind: {type: string}
        message: {type: string}
    Evaluation:
      type: object
      properties:
        time: {type: string, format: date-time}
        failing: {type: integer}
        holding: {type: integer}
        warning: {type: integer}
        known: {type: integer}
        unknown: {type: integer}
    DeploymentPage:
      type: object
      required: [items, next_cursor]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Deployment'}}
        next_cursor: {type: [string, 'null']}

    ObservationRequest:
      type: object
      required: [phase]
      additionalProperties: false
      properties:
        phase: {$ref: '#/components/schemas/Phase'}
    RollbackRequest:
      type: object
      additionalProperties: false
      properties:
        reason: {type: string, maxLength: 1000}
        executor: {type: string, description: 'Override the primary executor.'}
        targets: {type: array, items: {type: string}, description: 'Override the target set.'}
    FeedbackRequest:
      type: object
      additionalProperties: false
      required: [outcome]
      properties:
        outcome: {type: string, enum: [correct, false_positive, false_negative, unclear]}
        incident: {type: string, maxLength: 200, description: 'Incident or problem ticket backing the assessment.'}
        note: {type: string, maxLength: 2000}
    Feedback:
      type: object
      description: A person's assessment of the verdict (decision quality).
      required: [outcome, by, at]
      properties:
        outcome:
          type: string
          x-extensible-enum: [correct, false_positive, false_negative, unclear]
        incident: {type: string}
        note: {type: string}
        by: {type: string}
        at: {type: string, format: date-time}
    AbortRequest:
      type: object
      additionalProperties: false
      properties:
        reason: {type: string, maxLength: 1000, description: 'Recorded in the audit trail.'}
    ApprovalRequest:
      type: object
      additionalProperties: false
      properties:
        decision:
          type: string
          enum: [approve, reject]
          default: approve
          description: '`reject` applies only to a prepared rollback (approve mode).'
        comment: {type: string, maxLength: 1000}

    OperationStatus:
      type: string
      enum: [running, completed, failed]
    Operation:
      type: object
      required: [id, kind, status, service, created_at]
      properties:
        id: {type: string}
        kind: {type: string, x-extensible-enum: [observation, rollback, approval, baseline], description: 'New kinds may be added.'}
        status: {$ref: '#/components/schemas/OperationStatus'}
        service: {type: string}
        deployment_id: {type: string}
        phase: {type: string}
        created_by: {type: string}
        created_at: {type: string, format: date-time}
        finished_at: {type: string, format: date-time}
        result:
          type: object
          description: Where the deployment stood when the operation ended.
          properties:
            state: {$ref: '#/components/schemas/DeploymentStateValue'}
            verdict: {$ref: '#/components/schemas/Verdict'}
            exit_code: {type: integer}
            reason: {type: string}
            baseline_samples: {type: integer}
        error: {type: string, description: 'Why the operation could not run (status failed).'}
    OperationPage:
      type: object
      required: [items, next_cursor]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Operation'}}
        next_cursor: {type: [string, 'null']}

    Service:
      type: object
      required: [name, targets, phases, rules, executor]
      properties:
        name: {type: string}
        team: {type: string}
        preset: {type: string}
        targets: {type: array, items: {type: string}}
        control_targets: {type: array, items: {type: string}}
        phases: {type: array, items: {type: string}}
        rules:
          type: array
          items:
            type: object
            required: [name, action]
            properties:
              name: {type: string}
              action: {type: string, enum: [rollback, notify, hold]}
        executor: {type: string}
        traffic: {type: string}
        last_good_version: {type: string}
    ServicePage:
      type: object
      required: [items, next_cursor]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Service'}}
        next_cursor: {type: [string, 'null']}
    BaselineRequest:
      type: object
      additionalProperties: false
      properties:
        window: {type: string, description: 'Go duration such as 5m. Defaults to the service baseline window.', pattern: '^[0-9]+(ms|s|m|h)([0-9]+(ms|s|m))*$'}
    LastGoodRequest:
      type: object
      required: [version]
      additionalProperties: false
      properties:
        version: {type: string}
        reason: {type: string, maxLength: 1000}
    LastGood:
      type: object
      required: [service, version]
      properties:
        service: {type: string}
        version: {type: string}
        deployment_id: {type: string}

    Target:
      type: object
      required: [name, kind, connection]
      properties:
        name: {type: string}
        kind: {type: string}
        address: {type: string}
        labels: {type: object, additionalProperties: {type: string}}
        connection: {type: string, enum: [ssh, local, none]}
        services: {type: array, items: {type: string}}
    TargetPage:
      type: object
      required: [items, next_cursor]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Target'}}
        next_cursor: {type: [string, 'null']}

    Preset:
      type: object
      required: [name, version, ref, source]
      properties:
        name: {type: string}
        version: {type: integer}
        ref: {type: string, examples: ['java-web@1']}
        description: {type: string}
        source: {type: string, description: '"builtin" or the organisation preset file.'}
        params:
          type: array
          items:
            type: object
            required: [name, required]
            properties:
              name: {type: string}
              required: {type: boolean}
              default: {}
              description: {type: string}

    Circuit:
      type: object
      required: [state]
      properties:
        state: {type: string, enum: [CLOSED, OPEN, HALF_OPEN]}
        reason: {type: string}
        opened_at: {type: string, format: date-time}
        recent_failures: {type: integer}
    CircuitRequest:
      type: object
      required: [reason]
      additionalProperties: false
      properties:
        reason: {type: string, minLength: 1, maxLength: 1000}

    FreezeCreate:
      type: object
      required: [name, ends_at]
      additionalProperties: false
      properties:
        name: {type: string, minLength: 1}
        reason: {type: string}
        starts_at: {type: string, format: date-time, description: 'Default: now.'}
        ends_at: {type: string, format: date-time}
        services: {type: array, items: {type: string}, description: 'Empty with no teams = every service.'}
        teams: {type: array, items: {type: string}}
        allow_rollback: {type: boolean, default: true}
    Freeze:
      type: object
      required: [id, name, starts_at, ends_at, services, teams, allow_rollback, created_at]
      properties:
        id: {type: string}
        name: {type: string}
        reason: {type: string}
        starts_at: {type: string, format: date-time}
        ends_at: {type: string, format: date-time}
        services: {type: array, items: {type: string}}
        teams: {type: array, items: {type: string}}
        allow_rollback: {type: boolean}
        created_by: {type: string}
        created_at: {type: string, format: date-time}
        ended_by: {type: string}
        ended_at: {type: string, format: date-time}
    FreezeWindow:
      type: object
      required: [id, name, source, active, allow_rollback, services, teams]
      properties:
        id: {type: string, description: '"config:<name>" for config windows, else the API freeze ID.'}
        name: {type: string}
        reason: {type: string}
        source: {type: string, enum: [config, api]}
        active: {type: boolean}
        until: {type: string, format: date-time, description: 'End of the current occurrence, when active.'}
        allow_rollback: {type: boolean}
        starts_at: {type: string, format: date-time}
        ends_at: {type: string, format: date-time}
        weekly: {type: string, examples: ['fri 18:00 - mon 09:00 Asia/Seoul']}
        services: {type: array, items: {type: string}}
        teams: {type: array, items: {type: string}}
        created_by: {type: string}

    AuditEvent:
      type: object
      required: [seq, time, kind]
      properties:
        seq: {type: integer, description: 'Position in the store.'}
        time: {type: string, format: date-time}
        kind: {type: string}
        actor: {type: string}
        source: {type: string}
        action: {type: string}
        service: {type: string}
        deployment_id: {type: string}
        state: {type: string}
        reason: {type: string}
        ticket: {type: string}
        hash: {type: string}
        prev: {type: string}
    AuditEventPage:
      type: object
      required: [items, next_cursor]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/AuditEvent'}}
        next_cursor: {type: [string, 'null']}

    TokenResponse:
      type: object
      required: [access_token, token_type, expires_in, scope]
      properties:
        access_token: {type: string}
        token_type: {type: string, enum: [Bearer]}
        expires_in: {type: integer, description: Seconds.}
        scope: {type: string}
    OAuthError:
      type: object
      required: [error]
      properties:
        error: {type: string, enum: [invalid_request, invalid_client, unsupported_grant_type, invalid_scope, slow_down, server_error]}
        error_description: {type: string}

    Scope:
      type: string
      enum: [deployments:read, deployments:write, rollbacks:execute, approvals:write, circuit:admin, audit:read, metrics:write, config:write]
    RateLimit:
      type: object
      required: [rate, burst]
      properties:
        rate: {type: number, minimum: 0, description: 'Requests per second; 0 = no per-second limit.'}
        burst: {type: integer, minimum: 0}
        daily: {type: integer, minimum: 0, description: 'Requests per UTC day; 0 = no cap.'}
    ApiClient:
      type: object
      required: [id, name, type, scopes, grants, secret_hint, created_at, status]
      properties:
        id: {type: string}
        name: {type: string}
        type: {type: string, enum: [oauth, api_key]}
        description: {type: string}
        scopes: {type: array, items: {$ref: '#/components/schemas/ScopeValue'}}
        grants: {type: array, items: {type: string, examples: ['deployer@team=payments']}}
        secret_hint: {type: string, description: 'First characters of the secret.'}
        rate_limit: {$ref: '#/components/schemas/RateLimit'}
        expires_at: {type: string, format: date-time}
        created_by: {type: string}
        created_at: {type: string, format: date-time}
        rotated_at: {type: string, format: date-time}
        revoked_at: {type: string, format: date-time}
        last_used_at: {type: string, format: date-time, description: 'Updated at most hourly.'}
        status: {type: string, enum: [active, expired, revoked]}
    ApiClientCreate:
      type: object
      required: [name, type, scopes, grants]
      additionalProperties: false
      properties:
        name: {type: string, pattern: '^[a-z0-9][a-z0-9_-]{0,63}$'}
        type: {type: string, enum: [oauth, api_key]}
        description: {type: string}
        scopes: {type: array, minItems: 1, items: {$ref: '#/components/schemas/Scope'}}
        grants: {type: array, minItems: 1, items: {type: string}, description: 'role@scope: viewer|deployer|operator|admin|agent @ * | team=X | service=Y'}
        expires_at: {type: string, format: date-time}
        rate_limit: {$ref: '#/components/schemas/RateLimit'}
    ApiClientUpdate:
      type: object
      additionalProperties: false
      properties:
        description: {type: string}
        scopes: {type: array, minItems: 1, items: {$ref: '#/components/schemas/Scope'}}
        grants: {type: array, minItems: 1, items: {type: string}}
        expires_at: {type: string, format: date-time}
        rate_limit: {$ref: '#/components/schemas/RateLimit'}
    ApiClientSecret:
      type: object
      required: [client, secret]
      properties:
        client: {$ref: '#/components/schemas/ApiClient'}
        secret: {type: string, description: 'vcs_… (OAuth client secret) or vgk_… (API key). Shown once.'}
    ApiClientPage:
      type: object
      required: [items, next_cursor]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/ApiClient'}}
        next_cursor: {type: [string, 'null']}

    CloudEvent:
      type: object
      description: CloudEvents 1.0, structured JSON mode.
      required: [specversion, id, source, type, time, datacontenttype, sequence, data]
      properties:
        specversion: {type: string, enum: ['1.0']}
        id: {type: string, description: 'The sequence as a string; unique per cluster.'}
        source: {type: string}
        type:
          type: string
          description: See GET /v2/event-types. New types are added over time; ignore unknown ones.
          enum: [vigilante.deployment.created, vigilante.deployment.marked_good, vigilante.observation.started,
                 vigilante.observation.passed, vigilante.observation.failed, vigilante.observation.held,
                 vigilante.observation.aborted, vigilante.rollback.started, vigilante.rollback.completed,
                 vigilante.rollback.failed, vigilante.approval.requested, vigilante.approval.decided,
                 vigilante.circuit.opened, vigilante.circuit.half_opened, vigilante.circuit.closed,
                 vigilante.agent.lost, vigilante.webhook.disabled, vigilante.ping]
        subject: {type: string, description: 'Deployment ID, "circuit", target or webhook ID.'}
        time: {type: string, format: date-time}
        datacontenttype: {type: string, enum: [application/json]}
        sequence: {type: integer, description: 'Extension: cluster-wide order; the SSE id and Last-Event-ID.'}
        service: {type: string, description: 'Extension: the service, for filtering.'}
        team: {type: string, description: 'Extension: the owning team.'}
        data:
          type: object
          description: |
            Deployment events: deployment_id, service, version, previous_version,
            phase, state, verdict, reason, exit_code, targets, breaches.
            Circuit events: state, reason. approval.decided: deployment_id,
            approved_by, comment. agent.lost: target, last_seen, services.
    Webhook:
      type: object
      required: [id, url, types, services, teams, active, cursor, consecutive_failures, dead_letters, created_at, updated_at]
      properties:
        id: {type: string}
        url: {type: string}
        description: {type: string}
        types: {type: array, items: {type: string}, description: 'Empty = every type.'}
        services: {type: array, items: {type: string}}
        teams: {type: array, items: {type: string}}
        active: {type: boolean}
